name: Build Android aarch64

on:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp the build with (blank = auto)"
        required: false
        type: string
        default: ""
      upstream-ref:
        description: "Upstream branch/tag of googlecolab/google-colab-cli to build"
        required: false
        type: string
        default: "main"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the build with (blank = auto)"
        required: false
        type: string
        default: ""
      upstream-ref:
        description: "Upstream branch/tag of googlecolab/google-colab-cli to build"
        required: false
        type: string
        default: "main"
  pull_request:
    paths:
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android-aarch64:
    name: "android aarch64 (termux)"
    timeout-minutes: 60
    # Native arm64 runner so the Termux aarch64 image runs without QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout upstream google-colab-cli"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: googlecolab/google-colab-cli
          ref: ${{ inputs.upstream-ref || 'main' }}
          path: src-repo
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs needs tags

      - name: "Resolve version"
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          UPSTREAM_REF: ${{ inputs.upstream-ref || 'main' }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${UPSTREAM_REF}" == v[0-9]* ]]; then
            VERSION="${UPSTREAM_REF#v}"
          else
            VERSION="0.0.0.dev0+g${GITHUB_SHA::8}"
          fi
          echo "Building version: ${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: "Build wheelhouse in Termux"
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out
          ls -la src-repo | head -30   # sanity check: pyproject.toml must be here

          cat > build-termux.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          set -euxo pipefail
          VERSION="$1"

          export ANDROID_API_LEVEL=24
          # Project-specific only. The generic SETUPTOOLS_SCM_PRETEND_VERSION would
          # stamp every setuptools-scm package built from source (e.g. libcst).
          export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GOOGLE_COLAB_CLI="${VERSION}"
          export CARGO_NET_RETRY=10
          export DEBIAN_FRONTEND=noninteractive
          export OPENSSL_DIR="${PREFIX:-/data/data/com.termux/files/usr}"
          echo "ANDROID_API_LEVEL=${ANDROID_API_LEVEL} VERSION=${VERSION}"

          # Termux has no writable /tmp; use its own temp dir.
          T="${TMPDIR:-/data/data/com.termux/files/usr/tmp}"
          mkdir -p "${T}"

          # Pin official mirrors (pkg picks random, sometimes stale ones).
          SOURCES=/data/data/com.termux/files/usr/etc/apt/sources.list
          for MIRROR in \
            https://packages-cf.termux.dev/apt/termux-main \
            https://packages.termux.dev/apt/termux-main \
            https://grimler.se/termux/termux-main; do
            echo "deb ${MIRROR} stable main" > "${SOURCES}"
            apt-get update
            if apt-cache show maturin python-pyarrow >/dev/null 2>&1; then
              echo "Using mirror: ${MIRROR}"
              break
            fi
            echo "required packages not found on ${MIRROR}, trying next mirror"
          done

          apt-get -y -o Dpkg::Options::=--force-confnew upgrade
          apt-get -y -o Dpkg::Options::=--force-confnew install \
            python git rust clang make binutils pkg-config \
            libffi openssl maturin python-pyarrow

          git config --global --add safe.directory /work
          cd /work

          # 1. Build maturin once so the isolated build environments
          #    (cryptography, pydantic-core, rpds-py, ...) reuse it.
          python -m pip wheel maturin --wheel-dir "${T}/buildtools"

          # Android's loader needs extension modules to link libpython explicitly.
          PYVER="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          LIBDIR="${PREFIX:-/data/data/com.termux/files/usr}/lib"
          export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-L${LIBDIR} -C link-arg=-lpython${PYVER}"
          export LDFLAGS="${LDFLAGS:-} -L${LIBDIR} -lpython${PYVER}"

          # 2. Resolve the full dependency set in a venv that can see the system
          #    pyarrow, so pyarrow is treated as already satisfied (not built).
          python -m venv --system-site-packages "${T}/resolve"
          "${T}/resolve/bin/pip" install --dry-run --quiet \
            --report "${T}/report.json" --find-links "${T}/buildtools" .

          REPORT="${T}/report.json" python - <<'PY' > "${T}/reqs.txt"
          import json, os
          for item in json.load(open(os.environ["REPORT"]))["install"]:
              meta = item["metadata"]
              if meta["name"].lower().replace("_", "-") == "google-colab-cli":
                  continue
              print(meta["name"] + "==" + meta["version"])
          PY
          cat "${T}/reqs.txt"

          # 3. Build/download every wheel (no dependency resolution), then the CLI.
          python -m pip wheel --no-deps --find-links "${T}/buildtools" \
            -r "${T}/reqs.txt" --wheel-dir /out/wheels
          python -m pip wheel --no-deps --find-links "${T}/buildtools" \
            . --wheel-dir /out/wheels

          # 4. Smoke test: install from the wheelhouse only and run it.
          python -m venv --system-site-packages "${T}/venv"
          "${T}/venv/bin/pip" install --no-index --find-links /out/wheels google-colab-cli
          "${T}/venv/bin/colab" version
          EOF

          chmod 755 build-termux.sh
          # Termux runs as an unprivileged user inside the container.
          chmod -R a+rwX "$GITHUB_WORKSPACE"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/src-repo":/work \
            -v "$GITHUB_WORKSPACE/out":/out \
            -v "$GITHUB_WORKSPACE/build-termux.sh":/build-termux.sh:ro \
            termux/termux-docker:aarch64 \
            bash -l /build-termux.sh "${VERSION}"

      - name: "Package"
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          NAME="google-colab-cli-${VERSION}-android-aarch64"
          mkdir -p "dist/${NAME}"
          cp -r out/wheels "dist/${NAME}/wheels"
          cat > "dist/${NAME}/install.sh" <<'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          # Offline installer for Termux (Android aarch64). Requires python >= 3.12.
          set -eu
          DIR="$(cd "$(dirname "$0")" && pwd)"
          # pyarrow is provided by Termux, not bundled in the wheelhouse.
          if command -v pkg >/dev/null 2>&1; then
            pkg install -y python python-pyarrow
          fi
          python -m pip install --no-index --find-links "$DIR/wheels" google-colab-cli
          echo "Installed. Run: colab --help"
          EOF
          chmod +x "dist/${NAME}/install.sh"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: "Upload binary"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colab-cli-android-aarch64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 1
